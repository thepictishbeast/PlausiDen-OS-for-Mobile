[workspace]
members = [
    "brain-pd",
    "shield-pd",
    "vault-pd",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSL-1.1"
repository = "https://github.com/thepictishbeast/PlausiDen-OS-for-Mobile"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["serde"] }
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
blake3 = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
